<div class="hero-section" dir="rtl">
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/assets/images/home/herobg.png" class="d-block w-100" alt="Medical wellness center background 1">
      </div>
      <div class="carousel-item">
        <img src="/assets/images/home/aboutimg.jpg" class="d-block w-100" alt="Medical wellness center background 2">
      </div>
      <div class="carousel-item">
        <img src="/assets/images/home/herobg.png" class="d-block w-100" alt="Medical wellness center background 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <div class="hero-overlay">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
  </div>
  <div class="hero-socials">
    <a href="" class="social-icon" [attr.aria-label]="getTranslation('hero_facebook_aria')" target="_blank" rel="noopener">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a href="https://www.instagram.com/we_medical_/" class="social-icon" [attr.aria-label]="getTranslation('hero_instagram_aria')" target="_blank" rel="noopener">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://wa.me/966551028800" class="social-icon" [attr.aria-label]="getTranslation('hero_whatsapp_aria')" target="_blank" rel="noopener">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="https://x.com/W_E_Medical/status/1888319215918096538" class="social-icon" [attr.aria-label]="getTranslation('hero_twitter_aria')" target="_blank" rel="noopener">
      <i class="fab fa-twitter"></i>
    </a>
  </div>
  <div class="hero-container">
    <div class="hero-content">
      <div class="hero-title">
        <span class="title-main" id="typed-title"></span>
        <span class="title-main" id="typed-title-visible"></span>
        <span class="title-sub" id="typed-subtitle"></span>
        <span class="title-sub" id="typed-subtitle-visible"></span>
      </div>
    </div>
    <div class="hero-actions">
      <div class="hero-buttons">
        <button
          class="btn btn-primary"
          (click)="navigateToAppointment()"
          [attr.aria-label]="getTranslation('hero_appointment_button')">
          <span class="btn-icon">🏥</span>
          {{ getTranslation('hero_appointment_button') }}
        </button>
        <button
          class="btn btn-secondary"
          (click)="navigateToExplore()"
          [attr.aria-label]="getTranslation('hero_explore_button')">
          <span class="btn-icon">🔍</span>
          {{ getTranslation('hero_explore_button') }}
        </button>
      </div>
      <div class="hero-stats">
        <div class="stat-item">
          <span class="stat-number">10K+</span>
          <span class="stat-label">{{ getTranslation('hero_stats_patients') }}</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number">50+</span>
          <span class="stat-label">{{ getTranslation('hero_stats_doctors') }}</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number">24/7</span>
          <span class="stat-label">{{ getTranslation('hero_stats_support') }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
