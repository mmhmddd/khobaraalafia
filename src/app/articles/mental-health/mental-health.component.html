<section class="article-detail" dir="rtl" lang="ar">
  <div class="article-container">
    <div class="main-content">
      <h1 class="article-title">أهمية الصحة النفسية</h1>
      <div class="article-meta">
        <span class="meta-item"><i class="fas fa-calendar-alt"></i> تاريخ النشر: 27 سبتمبر 2025</span>
        <span class="meta-item"><i class="fas fa-user"></i> الكاتب: فريق التحرير</span>
      </div>
      <figure class="article-hero-image-container">
        <img
          src="/assets/images/articles/mental-health.jpg"
          alt="صورة توضيحية للصحة النفسية مع رموز للرفاهية والتوازن العاطفي"
          class="article-hero-image"
          loading="lazy"
        >
        <figcaption>صورة توضيحية للرفاهية النفسية والتوازن العاطفي</figcaption>
      </figure>

      <div class="article-content">
        <!-- Existing article content remains unchanged -->
        <p>الصحة النفسية هي حالة الاستقرار النفسي والعاطفي...</p>
        <!-- ... other content ... -->
        <p><a href="/media" class="article-link">اقرأ المزيد من المقالات الصحية</a></p>
      </div>

      <div class="article-footer">
        <p>المصادر: <a href="https://www.altibbi.com" target="_blank" rel="noopener">الطبي</a></p>
        <div class="share-buttons">
          <button class="btn-share" aria-label="مشاركة على فيسبوك" (click)="shareArticle('facebook')">
            <i class="fab fa-facebook-f"></i> فيسبوك
          </button>
          <button class="btn-share" aria-label="مشاركة على تويتر" (click)="shareArticle('twitter')">
            <i class="fab fa-twitter"></i> تويتر
          </button>
          <button class="btn-share" aria-label="مشاركة على واتساب" (click)="shareArticle('whatsapp')">
            <i class="fab fa-whatsapp"></i> واتساب
          </button>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="related-articles">
        <h3>مقالات ذات صلة</h3>
        <ul>
          <li *ngFor="let article of relatedArticles">
            <a [href]="article.path" class="related-article-link">
              <img [src]="article.image" [alt]="article.alt" class="related-article-thumb" loading="lazy">
              <span>{{ article.title }}</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>
  </div>
</section>
